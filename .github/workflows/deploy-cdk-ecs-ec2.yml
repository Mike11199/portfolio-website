name: Deploy portfolio ECS service

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: portfolio-ecs-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-west-1
  ECR_REPOSITORY: portfolio-website
  CDK_CLI_VERSION: 2.1139.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: cdk/uv.lock

      - name: Test and synthesize CDK
        working-directory: cdk
        run: |
          uv sync --frozen --group dev
          uv run pytest -q
          npm install --global "aws-cdk@$CDK_CLI_VERSION"
          cdk synth

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create ECR repository if missing
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPOSITORY" >/dev/null

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push React/nginx image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" frontend
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy CDK stack
        working-directory: cdk
        run: |
          cdk deploy PortfolioStack \
            --require-approval never \
            --parameters ImageTag="${{ github.sha }}"
