name: Deploy portfolio

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      hosting_mode:
        description: Serve the site with ECS or S3/CloudFront
        required: true
        default: static
        type: choice
        options: [ecs, static]

permissions:
  contents: read

concurrency:
  group: portfolio-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  CDK_CLI_VERSION: 2.1139.0
  ECR_REPOSITORY: portfolio-website
  HOSTING_MODE: ${{ inputs.hosting_mode || 'static' }}

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Save frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  cdk-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: cdk/uv.lock

      - name: Test and synthesize CDK apps
        working-directory: cdk
        run: |
          uv sync --frozen --group dev
          uv run pytest -q

  build-docker-image:
    name: build-docker-image
    needs: [cdk-test, frontend-check]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: cdk/uv.lock

      - name: Install pinned CDK CLI
        run: npm install --global "aws-cdk@$CDK_CLI_VERSION"

      - name: Deploy ECR repository stack
        working-directory: cdk
        run: |
          uv sync --frozen --group dev
          cdk deploy PortfolioRepositoryStack \
            --require-approval never

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build React/nginx image
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          IMAGE_TAG="${{ github.sha }}"
          docker build --file frontend/Dockerfile \
            --tag "$REGISTRY:$IMAGE_TAG" frontend

      - name: Push React/nginx image to ECR
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          IMAGE_TAG="${{ github.sha }}"
          docker push "$REGISTRY:$IMAGE_TAG"

  cdk-deploy:
    name: cdk-deploy
    needs: build-docker-image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: cdk/uv.lock

      - name: Install pinned CDK CLI
        run: npm install --global "aws-cdk@$CDK_CLI_VERSION"

      - name: Deploy portfolio
        working-directory: cdk
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          uv sync --frozen --group dev
          ZONE_ID="$(aws cloudformation list-exports --query "Exports[?Name=='SharedPortfolioHostedZoneId'].Value | [0]" --output text)"
          cdk deploy PortfolioStack PortfolioMediaStack --exclusively --require-approval never \
            --parameters PortfolioStack:ImageTag="$IMAGE_TAG" \
            --parameters PortfolioStack:HostingMode="$HOSTING_MODE" \
            --parameters PortfolioMediaStack:HostedZoneId="$ZONE_ID" \
            --outputs-file outputs.json

          BUCKET="$(jq -er '.PortfolioStack.WebsiteBucketName' outputs.json)"
          DOMAIN="$(jq -er '.PortfolioMediaStack.WebsiteDomainName' outputs.json)"
          DISTRIBUTION="$(jq -er '.PortfolioMediaStack.DistributionId' outputs.json)"
          aws s3 sync ../frontend/dist "s3://$BUCKET/website/" --exclude index.html
          aws s3 cp ../frontend/dist/index.html "s3://$BUCKET/website/index.html" --cache-control no-cache
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/*'

          # Pass the cross-region CloudFront domain to the root DNS alias.
          cdk deploy PortfolioStack --exclusively --require-approval never \
            --parameters PortfolioStack:ImageTag="$IMAGE_TAG" \
            --parameters PortfolioStack:HostingMode="$HOSTING_MODE" \
            --parameters PortfolioStack:WebsiteDomainName="$DOMAIN"
