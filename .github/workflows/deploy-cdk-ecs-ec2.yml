name: Deploy portfolio ECS service

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: portfolio-ecs-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-west-1
  CDK_CLI_VERSION: 2.1139.0
  ECR_REPOSITORY: portfolio-website

jobs:
  cdk-test:
    name: cdk-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: cdk/uv.lock

      - name: Install pinned CDK CLI
        run: npm install --global "aws-cdk@$CDK_CLI_VERSION"

      - name: Run tests and synth
        working-directory: cdk
        run: |
          uv sync --frozen --group dev
          uv run pytest -q
          cdk synth

  build-docker-image:
    name: build-docker-image
    needs: cdk-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure single ECR repository exists (idempotent)
        run: |
          aws ecr describe-repositories --repository-names "${{ env.ECR_REPOSITORY }}" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "${{ env.ECR_REPOSITORY }}" >/dev/null

      - name: Build and push React/nginx image
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          IMAGE_TAG="${{ github.sha }}"
          docker build --file frontend/Dockerfile \
            --tag "$REGISTRY:$IMAGE_TAG" .
          docker push "$REGISTRY:$IMAGE_TAG"

  cdk-deploy:
    name: cdk-deploy
    needs: build-docker-image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: cdk/uv.lock

      - name: Install pinned CDK CLI
        run: npm install --global "aws-cdk@$CDK_CLI_VERSION"

      - name: Deploy ECS stack with image tag
        working-directory: cdk
        run: |
          uv sync --frozen --group dev
          cdk deploy PortfolioStack \
            --require-approval never \
            --parameters ImageTag="${{ github.sha }}"
