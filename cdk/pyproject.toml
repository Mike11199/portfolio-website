[project]
name = "portfolio-cdk"
version = "0.1.0"
description = "AWS CDK for the portfolio ECS service"
requires-python = ">=3.11"
dependencies = [
    "aws-cdk-lib>=2.200.0,<3.0.0",
    "constructs>=10.0.0,<11.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0,<9.0.0"]

[tool.pytest.ini_options]
testpaths = ["portfolio_cdk/tests"]
pythonpath = ["."]
