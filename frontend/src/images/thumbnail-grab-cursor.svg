<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="25" height="25" viewBox="0 0 25 25">
  <!-- Original pointer pixels, with the index fingertip moved down five pixels. -->
  <defs>
    <image id="pointer" width="25" height="25" xlink:href="data:image/png;base64,"/>
    <clipPath id="hand"><path d="M0 0H25V25H0Z M7 0V10H11V0Z" clip-rule="evenodd"/></clipPath>
    <clipPath id="fingertip"><rect x="7" y="2" width="4" height="3"/></clipPath>
  </defs>
  <use xlink:href="#pointer" clip-path="url(#hand)"/>
  <g transform="translate(0 5)">
    <use xlink:href="#pointer" clip-path="url(#fingertip)"/>
  </g>
</svg>
